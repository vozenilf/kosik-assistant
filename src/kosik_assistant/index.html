<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Košík asistent</title>
<style>
  :root { --green: #1f7a3a; --bg: #f6f7f5; --line: #dde3da; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #1d241f; }
  header { background: var(--green); color: white; padding: 12px 20px; font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px;
         max-width: 1100px; margin: 0 auto; height: calc(100vh - 48px); }
  #chat { display: flex; flex-direction: column; background: white; border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--green); color: white; }
  .assistant { align-self: flex-start; background: #eef2ec; }
  .event { align-self: flex-start; font-size: 12px; color: #66705f; font-family: monospace; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
  .chip { border: 1px solid var(--green); color: var(--green); background: white;
          border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px; }
  input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
  button[type=submit] { background: var(--green); color: white; border: 0; border-radius: 8px;
                        padding: 0 16px; font-size: 15px; cursor: pointer; }
  aside { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 16px;
          overflow-y: auto; }
  aside h2 { margin: 0 0 8px; font-size: 16px; }
  .line { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0;
          border-bottom: 1px dashed var(--line); font-size: 14px; }
  .muted { color: #66705f; font-size: 13px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } #log { min-height: 50vh; } }
</style>
</head>
<body>
<header>Košík asistent</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div id="chips">
      <button class="chip">Doplň můj běžný nákup</button>
      <button class="chip">Nakup suroviny na svíčkovou pro 4 lidi</button>
      <button class="chip">Co mám v košíku?</button>
      <button class="chip">Pokračovat k objednávce</button>
    </div>
    <form id="form">
      <input id="input" placeholder="Napiš, co chceš nakoupit…" autocomplete="off">
      <button type="submit">Poslat</button>
    </form>
  </section>
  <aside>
    <h2>Košík</h2>
    <div id="cart" class="muted">Košík je prázdný.</div>
  </aside>
</main>
<script>
  const sessionId = crypto.randomUUID();  // one conversation per browser tab
  const log = document.getElementById("log");
  const input = document.getElementById("input");

  function add(kind, text) {
    const div = document.createElement("div");
    div.className = kind;
    div.textContent = text;            // textContent, never innerHTML: no HTML injection
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function showCart(cart) {
    const box = document.getElementById("cart");
    box.replaceChildren();
    if (!cart.items.length) { box.textContent = "Košík je prázdný."; return; }
    for (const item of cart.items) {
      const line = document.createElement("div");
      line.className = "line";
      line.textContent = `${item.quantity}× ${item.name} (${item.package})`;
      const price = document.createElement("span");
      price.textContent = `${item.line_total.toFixed(2)} Kč`;
      line.appendChild(price);
      box.appendChild(line);
    }
    const sum = document.createElement("p");
    sum.textContent = `Mezisoučet: ${cart.subtotal.toFixed(2)} Kč, doprava: ${cart.delivery_fee} Kč`;
    box.appendChild(sum);
    const free = document.createElement("p");
    free.className = "muted";
    free.textContent = cart.missing_for_free_delivery > 0
      ? `Do dopravy zdarma chybí ${cart.missing_for_free_delivery.toFixed(2)} Kč.`
      : "Doprava zdarma ✓";
    box.appendChild(free);
  }

  async function send(text) {
    add("msg user", text);
    const waiting = add("event", "hledám…");
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, message: text}),
      });
      const data = await response.json();
      waiting.remove();
      for (const event of data.events) {
        if (event.kind !== "tool_result") add("event", `[${event.kind}] ${event.text.slice(0, 160)}`);
      }
      add("msg assistant", data.answer);
      showCart(data.cart);
    } catch (error) {
      waiting.textContent = "Chyba spojení – zkus to znovu.";
    }
  }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (text) { input.value = ""; send(text); }
  });
  for (const chip of document.querySelectorAll(".chip")) {
    chip.addEventListener("click", () => send(chip.textContent));
  }
  fetch("/api/cart").then((r) => r.json()).then(showCart);
</script>
</body>
</html>
